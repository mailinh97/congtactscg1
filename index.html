:root{--ink:#13271f;--muted:#5f7468;--paper:#eff3f0;--card:#fff;--line:#dce4de;--pine:#0f2e24;--pine2:#1b4636;--accent:#2a7556;--accent-d:#215e45;--brass:#b8862e;--brass-bg:#fbf0d6;--ok-bg:#d9f0e2;--ok:#1f6a45;--bad:#a8392f;--r:12px;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid transparent;border-radius:9px;background:var(--accent);color:#fff;padding:9px 16px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:var(--accent-d)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #7cc4a2;outline-offset:2px}
.light{background:#fff;color:var(--accent-d);border-color:var(--line)}.light:hover:not(:disabled){background:#eef5f0;border-color:#c3d3c8}
.light[data-action^=delete]{color:var(--bad)}.light[data-action^=delete]:hover{background:#fdeeec;border-color:#efc4bf}
.danger{background:var(--bad)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd8cf;border-radius:9px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px #2a755626}
label{display:block;font-size:13px;font-weight:600;color:#38544a;margin:12px 0}label input,label select,label textarea{margin-top:6px;font-weight:400}

p{margin:6px 0;color:var(--muted)}

function cloudError(e){
 if(e?.code==='40001')return 'Có người vừa sửa dữ liệu. Đóng biểu mẫu, bấm Đồng bộ rồi thực hiện lại; thay đổi của bạn chưa được lưu.';
 if(e?.code==='42501')return e.message||'Tài khoản chưa được cấp quyền.';
 if(e?.message==='Failed to fetch')return 'Không kết nối được máy chủ. Kiểm tra Internet; thay đổi chưa được lưu.';
 return e?.message||String(e);
}
function resetView(){data=initial();user=null;account=null;revision=null;lastSync='';readEpoch++;document.getElementById('modal').close();}
function paintSync(){const el=document.getElementById('cloud-status');if(el){el.textContent=storageError||('Đồng bộ lúc '+(lastSync||'—')+' · Tự cập nhật mỗi 15 giây');el.className=storageError?'error':'muted';}}
async function loadCloud(force=false){
 if(!cloud||!user||reading||(!force&&(busy||document.getElementById('modal').open||dpOpen)))return;
 const epoch=readEpoch;reading=true;
 try{
  const {data:result,error}=await cloud.rpc('sct_read');if(error)throw error;
  if(epoch!==readEpoch||!user)return;
  // A background request started before a form opened must not replace its base revision.
  if(!force&&(busy||document.getElementById('modal').open||dpOpen))return;
  const next=validate(result.document);const changed=revision!==result.revision||!account;
  data=next;revision=result.revision;account={role:result.role,personId:result.personId};storageError='';lastSync=new Date().toLocaleTimeString('vi-VN');
  if(changed&&!document.getElementById('modal').open)render();else paintSync();
 }catch(e){
  if(epoch!==readEpoch)return;
  storageError=cloudError(e);
  if(e.code==='42501'||e.code==='PGRST301'||e.code==='PGRST303'){resetView();render();}
  else paintSync();
  if(force)throw e;
 }finally{reading=false;}
}
async function save(next){
 if(!admin())throw Error('Không có quyền.');
 if(busy)throw Error('Đang lưu, vui lòng chờ.');
 if(storageError)throw Error('Hãy đóng biểu mẫu và bấm Đồng bộ trước khi lưu tiếp.');
 validate(next);busy=true;
 try{
  const {data:r,error}=await cloud.rpc('sct_save',{next_document:next,expected_revision:revision});
  if(error)throw error;data=next;revision=r;lastSync=new Date().toLocaleTimeString('vi-VN');
 }catch(e){throw Error(cloudError(e));}finally{busy=false;}
}
async function mutate(fn){const next=structuredClone(data);fn(next);await save(next);}
async function login(e){
 e.preventDefault();const f=new FormData(e.target),button=e.target.querySelector('button:not([type="button"])'),err=document.getElementById('login-error');
 if(!cloud){err.textContent=storageError||'Chưa cấu hình Supabase. Xem file HUONG_DAN.md.';return;}
 button.disabled=true;err.textContent='Đang đăng nhập…';
 try{
  const {data:s,error}=await cloud.auth.signInWithPassword({email:String(f.get('username')).trim(),password:String(f.get('password'))});
  if(error)throw Error('Không đăng nhập được. Kiểm tra email, mật khẩu và kết nối.');
  user=s.user.email;view='overview';message='';await loadCloud(true);
  if(!account)throw Error('Chưa tải được quyền tài khoản.');render();
 }catch(ex){resetView();render();document.getElementById('login-error').textContent=cloudError(ex);}

async function logout(){

 resetView();storageError='';render();

async function startCloud(){
 try{
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(config.url||'')||!config.publishableKey)throw Error('Chưa kết nối dữ liệu chung. Điền Project URL và Publishable key trong config.js theo HUONG_DAN.md.');
  const key=config.publishableKey;
  if(key.startsWith('sb_secret_'))throw Error('Không được dùng Secret key trên website. Hãy thay bằng Publishable key.');
  if(key.startsWith('eyJ')){let payload;try{payload=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch{throw Error('Khóa công khai không hợp lệ.');}if(payload.role!=='anon')throw Error('Chỉ dùng anon public key hoặc Publishable key.');}
  if(!window.supabase)throw Error('Thiếu vendor/supabase.js. Hãy tải đầy đủ thư mục web lên GitHub.');
  cloud=window.supabase.createClient(config.url,key,{auth:{storage:sessionStorage,storageKey:'sct-cloud-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  cloud.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT'){resetView();render();}});
  const {data:s,error}=await cloud.auth.getSession();if(error)throw error;
  if(s.session){user=s.session.user.email;await loadCloud(true);}
 }catch(e){storageError=cloudError(e);if(user)resetView();}
 render();
}

addEventListener('scroll',e=>{if(dpOpen&&!(e.target.closest&&e.target.closest('.dp-pop')))dpClose();},true);

function labelCells(){document.querySelectorAll('.table table').forEach(t=>{const h=[...t.tHead.rows[0].cells].map(c=>c.textContent);t.querySelectorAll('tbody tr').forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.label=h[i]));});}
function overview(){const rows=mine().filter(t=>t.departure<=endMonth(month)&&(t.actualReturn||t.returnDate)>=month+'-01');return `<div class="row"><div><h1>${admin()?'Công tác trong tháng':'Lịch công tác của tôi'}</h1><p>${admin()?'Theo dõi lịch đi, ngày về của đơn vị.':esc(me()?.name)+' · Chỉ hiển thị lịch của bạn.'}</p></div>${admin()?'<button data-action="new-trip">+ Thêm đợt công tác</button>':''}</div><div class="filters"><label>Tháng theo dõi${dp('month','month',month)}</label></div>${admin()&&view==='overview'?`<div class="grid presence-grid">${presence('Đang đi công tác',people().filter(p=>away(p.id)),'out','Không có quân nhân đang công tác.')}${presence('Đang ở đơn vị',people().filter(p=>!away(p.id)),'in','Không có quân nhân ở đơn vị.')}</div>`:''}<div class="stats${admin()?' stats2':''}"><div class="stat">${admin()?'Tổng các đợt đi công tác':'Số đợt đi công tác trong tháng'}<b>${rows.length}</b></div>${admin()?'':`<div class="stat">Tổng số ngày đã đi công tác<b>${mine().reduce((n,t)=>{const e=t.actualReturn||(t.returnDate<today()?t.returnDate:today());return t.departure<=today()?n+days(t.departure,e):n;},0)}</b></div>`}<div class="stat">Chờ xác nhận về<b>${mine().filter(t=>!t.actualReturn&&t.returnDate<=today()).length}</b></div></div><section class="card">${table(rows)}</section>`;}
function roster(){return `<div class="row"><div><h1>Thông tin quân nhân</h1><p>${people().length} quân nhân trong danh sách</p></div><button data-action="new-person">+ Thêm quân nhân</button></div><div class="card table"><table><thead><tr><th>Họ tên</th><th>Cấp bậc</th><th>Chức vụ</th><th>Mã hồ sơ</th><th>Thao tác</th></tr></thead><tbody>${people().map(p=>`<tr><td><button class="link" data-action="history" data-id="${esc(p.id)}">${esc(p.name)}</button></td><td>${esc(p.rank)}</td><td>${esc(p.position)}</td><td>${esc(p.username)}</td><td><button class="light" data-action="link-member" data-id="${esc(p.id)}">Gắn tài khoản</button><button class="light" data-action="delete-person" data-id="${esc(p.id)}">Xóa khỏi danh sách</button></td></tr>`).join('')}</tbody></table></div>`;}
function backupPage(){return `<h1>Sao lưu dữ liệu chung</h1><section class="card"><p>Tải dữ liệu máy chủ về tệp JSON để tự lưu giữ. Không tải tệp sao lưu lên GitHub.</p><div class="tools"><button data-action="export">Tải tệp sao lưu</button><button class="light" data-action="import">Nhập bản sao lưu cũ</button></div><p class="muted">Nhập tệp sẽ thay toàn bộ danh sách và lịch dùng chung, nhưng không tạo tài khoản đăng nhập. Hãy sao lưu trước và kiểm tra lại các tài khoản đã gắn.</p><input type="file" id="importFile" accept=".json,application/json" hidden></section>`;}

function dialog(html){const d=document.getElementById('modal');d.innerHTML=html;d.showModal();}
const input=(name,label,value='',type='text',required=true)=>type==='date'?`<label>${label}${dp('date',name,value,required)}</label>`:`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="2000"></label>`;
function editTrip(id=''){if(!admin())return;let t=data.trips.find(t=>t.id===id);let available=people().filter(p=>p.id===t?.personId||!away(p.id));dialog(`<h2>${t?'Sửa':'Thêm'} đợt công tác</h2><form id="tripForm"><label>Thông tin quân nhân<select name="personId" required><option value="">Chọn quân nhân đang ở đơn vị</option>${available.map(p=>`<option value="${esc(p.id)}" ${p.id===t?.personId?'selected':''}>${esc(idLine(p))}</option>`).join('')}</select></label><div class="grid"><div class="full">${input('plan','Theo kế hoạch',t?.plan)}${input('destination','Nơi công tác',t?.destination)}${input('purpose','Nội dung công tác',t?.purpose,'text',false)}</div>${input('departure','Ngày đi',t?.departure||today(),'date')}${input('returnDate','Ngày về dự kiến',t?.returnDate||today(),'date')}${t?input('actualReturn','Ngày về thực tế',t.actualReturn,'date',false):''}</div><p class="muted">Quân nhân đang công tác được ẩn khỏi danh sách chọn. Ký hiệu cấp bậc và chức vụ lấy từ hồ sơ đã chọn.</p><p id="formError" role="alert"></p><div class="row"><button type="button" class="light" data-action="close">Hủy</button><button>Lưu công tác</button></div></form>`);document.getElementById('tripForm').onsubmit=async e=>{e.preventDefault();try{if(!admin())throw Error('Không có quyền.');const b=Object.fromEntries(new FormData(e.target)),p=people().find(p=>p.id===b.personId);if(!p)throw Error('Chọn quân nhân.');if(!b.plan.trim())throw Error('Nhập mục Theo kế hoạch.');if(!b.destination.trim())throw Error('Nhập mục Nơi công tác.');if(away(p.id)&&p.id!==t?.personId)throw Error('Quân nhân đang đi công tác.');if(!validDate(b.departure)||!validDate(b.returnDate)||b.returnDate<b.departure)throw Error('Ngày về phải bằng hoặc sau ngày đi.');if(b.actualReturn&&(!validDate(b.actualReturn)||b.actualReturn<b.departure||b.actualReturn>today()))throw Error('Ngày về thực tế phải từ ngày đi đến hôm nay.');if(data.trips.some(x=>x.id!==id&&x.personId===p.id&&x.departure<=(b.actualReturn||b.returnDate)&&(x.actualReturn||x.returnDate)>=b.departure))throw Error('Lịch công tác bị trùng.');let next={id:t?.id||crypto.randomUUID(),personId:p.id,name:p.name,unit:t?.unit||'',destination:b.destination.trim().toUpperCase(),plan:b.plan.trim().toUpperCase(),purpose:b.purpose.trim(),departure:b.departure,returnDate:b.returnDate,actualReturn:b.actualReturn||null,confirmedBy:b.actualReturn?user:''};await mutate(d=>{if(t)d.trips[d.trips.findIndex(x=>x.id===id)]=next;else d.trips.push(next);});document.getElementById('modal').close();notice('Đã lưu đợt công tác lên dữ liệu chung.');}catch(err){document.getElementById('formError').textContent=err.message;}};}
function newPerson(){if(!admin())return;dialog(`<h2>Thêm quân nhân</h2><form id="personForm">${input('name','Họ và tên')}${input('rank','Cấp bậc','1//CN')}${input('position','Chức vụ','Lái Xe')}<p>Mã hồ sơ tự tạo từ họ tên. Sau khi thêm, bấm “Gắn tài khoản” để liên kết với email đã tạo trong Supabase Authentication.</p><p id="formError" role="alert"></p><div class="row"><button type="button" class="light" data-action="close">Hủy</button><button>Thêm quân nhân</button></div></form>`);document.getElementById('personForm').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target)),u=slug(f.name);if(!u||['admin1','admin2'].includes(u)||data.people.some(p=>p.username===u))throw Error('Tên đăng nhập trùng hoặc không hợp lệ.');await mutate(d=>d.people.push({id:crypto.randomUUID(),name:f.name.trim(),rank:f.rank.trim(),position:f.position.trim(),username:u,active:true}));document.getElementById('modal').close();notice('Đã thêm hồ sơ '+u+'. Hãy gắn tài khoản đăng nhập cho hồ sơ này.');}catch(err){document.getElementById('formError').textContent=err.message;}};}
async function confirmReturn(id){
 const t=mine().find(t=>t.id===id);if(!t||t.actualReturn||t.departure>today()||t.returnDate>today()||busy)return;
 if(!confirm('Xác nhận đã thực sự về đơn vị? Ngày về sẽ do máy chủ ghi nhận.'))return;
 busy=true;
 try{const {error}=await cloud.rpc('sct_confirm',{trip_id:id});if(error)throw error;await loadCloud(true);notice('Đã xác nhận về đơn vị trên máy chủ.');}
 catch(e){showError(e);}finally{busy=false;}
}
function linkMember(id){
 dialog(`<h2>Gắn tài khoản đăng nhập</h2><p>Tạo người dùng trong Supabase Authentication trước, sau đó nhập đúng email tại đây. Gắn email mới sẽ thay tài khoản đang gắn với hồ sơ này.</p><form id="linkForm">${input('email','Email tài khoản','','email')}<p id="formError"></p><div class="row"><button type="button" class="light" data-action="close">Hủy</button><button>Gắn tài khoản</button></div></form>`);
 document.getElementById('linkForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const email=new FormData(e.target).get('email');const {error}=await cloud.rpc('sct_link_member',{member_email:email,member_person_id:id});if(error)throw error;document.getElementById('modal').close();notice('Đã gắn tài khoản. Quân nhân có thể đăng nhập bằng email riêng.');}catch(err){document.getElementById('formError').textContent=cloudError(err);}finally{busy=false;}};
}
async function download(){if(!admin())return;await loadCloud(true);if(!admin())return;let raw=JSON.stringify(data,null,2);const url=URL.createObjectURL(new Blob([raw||''],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Cong_tac_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importFile(e){if(!admin())return;try{const f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('Tệp quá lớn, tối đa 20 MB.');const next=validate(JSON.parse(await f.text()));if(!confirm(`Thay toàn bộ dữ liệu CHUNG trên máy chủ bằng ${next.people.length} hồ sơ và ${next.trips.length} đợt công tác?\nBạn nên tải bản sao lưu hiện tại trước.`))return;await save(next);notice('Đã nhập bản sao lưu lên máy chủ. Hãy kiểm tra và gắn lại tài khoản nếu cần.');}catch(err){showError(err);}}
const upPlan=e=>{const i=e.target;if(!i||!['plan','destination'].includes(i.name)||e.isComposing)return;const a=i.selectionStart,b=i.selectionEnd,u=i.value.toUpperCase();if(u!==i.value){i.value=u;try{i.setSelectionRange(a,b);}catch{}}};
document.addEventListener('input',upPlan);document.addEventListener('compositionend',upPlan);
document.addEventListener('click',e=>{const t=e.target.closest('[data-pw]');if(!t)return;const i=t.parentElement.querySelector('input'),show=i.type==='password';i.type=show?'text':'password';t.textContent=show?'Ẩn':'Hiện';t.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(busy)return;try{if(b.dataset.view){nav(b.dataset.view);return;}const a=b.dataset.action,id=b.dataset.id;if(a==='logout'){await logout();return;}if(a==='sync'){await loadCloud(true);return;}if(a==='close')document.getElementById('modal').close();if(a==='return'){await confirmReturn(id);return;}if(!admin())return;if(a==='roster')nav('roster');if(a==='history'){personId=id;view='history';historyMode='all';render();}if(a==='new-trip')editTrip();if(a==='edit')editTrip(id);if(a==='new-person')newPerson();if(a==='link-member')linkMember(id);if(a==='delete-trip'&&confirm('Xóa đợt công tác này? Hành động không thể hoàn tác nếu chưa sao lưu.')){await mutate(d=>d.trips=d.trips.filter(t=>t.id!==id));notice('Đã xóa đợt công tác.');}if(a==='delete-person'){if(away(id))throw Error('Quân nhân đang công tác. Hãy xác nhận về trước.');if(confirm('Đưa quân nhân ra khỏi danh sách và ngừng tài khoản? Lịch sử công tác vẫn được giữ trong dữ liệu.')){await mutate(d=>d.people.find(p=>p.id===id).active=false);notice('Đã đưa quân nhân ra khỏi danh sách.');}}if(a==='export')await download();if(a==='import')document.getElementById('importFile').click();}catch(err){showError(err);}});
setInterval(()=>{if(user&&!document.hidden)loadCloud().catch(showError);},15000);
window.addEventListener('online',()=>{if(user)loadCloud().catch(showError);});
document.addEventListener('visibilitychange',()=>{if(user&&!document.hidden)loadCloud().catch(showError);});
setInterval(()=>{if(user&&!dpOpen&&!document.getElementById('modal').open&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))render();},60000);
document.getElementById('modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
render();startCloud();
</script></body></html>
