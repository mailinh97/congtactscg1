:root{--ink:#13271f;--muted:#5f7468;--paper:#eff3f0;--card:#fff;--line:#dce4de;--pine:#0f2e24;--pine2:#1b4636;--accent:#2a7556;--accent-d:#215e45;--brass:#b8862e;--brass-bg:#fbf0d6;--ok-bg:#d9f0e2;--ok:#1f6a45;--bad:#a8392f;--r:12px;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid transparent;border-radius:9px;background:var(--accent);color:#fff;padding:9px 16px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
button:hover:not(:disabled){background:var(--accent-d)}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #7cc4a2;outline-offset:2px}
.light{background:#fff;color:var(--accent-d);border-color:var(--line)}.light:hover:not(:disabled){background:#eef5f0;border-color:#c3d3c8}
.light[data-action^=delete]{color:var(--bad)}.light[data-action^=delete]:hover{background:#fdeeec;border-color:#efc4bf}
.danger{background:var(--bad)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd8cf;border-radius:9px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px #2a755626}
label{display:block;font-size:13px;font-weight:600;color:#38544a;margin:12px 0}label input,label select,label textarea{margin-top:6px;font-weight:400}

p{margin:6px 0;color:var(--muted)}

const longDate=s=>{const [y,m,d]=s.split('-');return `${WD[new Date(s+'T00:00:00Z').getUTCDay()]}, ngày ${+d} tháng ${+m} năm ${y}`;};
function dpLabel(kind,v){if(!v)return kind==='date'?'Chọn ngày':'Chọn tháng';const [y,m,d]=v.split('-');return kind==='date'?`${d}/${m}/${y}`:`Tháng ${+m}/${y}`;}
function dp(kind,name,value,required=true){const v=value||'';return `<span class="dp" data-kind="${kind}" data-req="${required?1:0}"><input type="hidden" id="${name}" name="${name}" value="${esc(v)}"><button type="button" class="dp-btn${v?'':' empty'}" data-dp="toggle" aria-haspopup="dialog" aria-expanded="false"><span>${dpLabel(kind,v)}</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button></span>`;}
let dpOpen=null;
function dpClose(focus){if(!dpOpen)return;dpOpen.pop.remove();dpOpen.btn.setAttribute('aria-expanded','false');if(focus)dpOpen.btn.focus();dpOpen=null;}
function dpPlace(){const {btn,pop}=dpOpen,r=btn.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;let l=Math.min(Math.max(8,r.left),innerWidth-pw-8),t=r.bottom+6;if(t+ph>innerHeight-8)t=r.top-ph-6>=8?r.top-ph-6:Math.max(8,innerHeight-ph-8);pop.style.left=l+'px';pop.style.top=t+'px';}
function dpDraw(){const {w,pop,st}=dpOpen,kind=w.dataset.kind,v=w.querySelector('input').value,pad=n=>String(n).padStart(2,'0'),t=today();let h;
if(st.mode==='days'){const first=(new Date(Date.UTC(st.y,st.m-1,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(st.y,st.m,0)).getUTCDate();h=`<div class="dp-head"><button type="button" data-dp="prev" aria-label="Tháng trước">‹</button><button type="button" class="dp-title" data-dp="mode">Tháng ${st.m} năm ${st.y}</button><button type="button" data-dp="next" aria-label="Tháng sau">›</button></div><div class="dp-grid">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<span class="dp-wd">${x}</span>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:n},(_,i)=>{const d=`${st.y}-${pad(st.m)}-${pad(i+1)}`;return `<button type="button" class="dp-day${d===v?' sel':''}${d===t?' now':''}" data-dp="day" data-v="${d}">${i+1}</button>`;}).join('')}</div>`;}
else{h=`<div class="dp-head"><button type="button" data-dp="prev" aria-label="Năm trước">‹</button><span class="dp-title">Năm ${st.y}</span><button type="button" data-dp="next" aria-label="Năm sau">›</button></div><div class="dp-grid months">${Array.from({length:12},(_,i)=>{const k=`${st.y}-${pad(i+1)}`;return `<button type="button" class="dp-mo${v.slice(0,7)===k?' sel':''}${t.slice(0,7)===k?' now':''}" data-dp="month" data-m="${i+1}">Tháng ${i+1}</button>`;}).join('')}</div>`;}
h+=`<div class="dp-foot"><button type="button" data-dp="today">${kind==='date'?'Hôm nay':'Tháng này'}</button>${w.dataset.req==='1'?'':'<button type="button" data-dp="clear">Xóa</button>'}</div>`;pop.innerHTML=h;dpPlace();}
function dpCommit(v){const {w,btn}=dpOpen,hid=w.querySelector('input');hid.value=v;btn.classList.toggle('empty',!v);btn.firstElementChild.textContent=dpLabel(w.dataset.kind,v);dpClose(true);hid.dispatchEvent(new Event('change',{bubbles:true}));}
document.addEventListener('click',e=>{if(dpOpen&&!document.contains(dpOpen.w))dpOpen=null;const pop=e.target.closest('.dp-pop');if(pop)e.preventDefault();const b=e.target.closest('[data-dp]');if(!b){if(dpOpen&&!e.target.closest('.dp'))dpClose();return;}
const w=b.closest('.dp'),kind=w.dataset.kind,a=b.dataset.dp;
if(a==='toggle'){const same=dpOpen&&dpOpen.w===w;dpClose();if(same)return;const v=w.querySelector('input').value||today(),el=document.createElement('div');el.className='dp-pop';el.setAttribute('role','dialog');el.setAttribute('aria-label',kind==='date'?'Chọn ngày':'Chọn tháng');w.appendChild(el);b.setAttribute('aria-expanded','true');dpOpen={w,btn:b,pop:el,st:{mode:kind==='date'?'days':'months',y:+v.slice(0,4),m:+v.slice(5,7)}};dpDraw();return;}
if(!dpOpen||dpOpen.w!==w)return;const st=dpOpen.st,pad=n=>String(n).padStart(2,'0');
if(a==='prev'||a==='next'){const s=a==='next'?1:-1;if(st.mode==='days'){st.m+=s;if(st.m<1){st.m=12;st.y--;}if(st.m>12){st.m=1;st.y++;}}else st.y+=s;st.y=Math.min(9999,Math.max(1000,st.y));dpDraw();}
else if(a==='mode'){st.mode='months';dpDraw();}
else if(a==='month'){if(kind==='month')dpCommit(`${st.y}-${pad(+b.dataset.m)}`);else{st.m=+b.dataset.m;st.mode='days';dpDraw();}}
else if(a==='day')dpCommit(b.dataset.v);
else if(a==='today')dpCommit(kind==='date'?today():today().slice(0,7));
else if(a==='clear')dpCommit('');});
const NOTI='sct_due_notified';let lastDue='',notiAsked=false;try{notiAsked=!!localStorage.getItem(NOTI+'_asked');}catch{}
async function notify(title,body,tag){let reg;try{reg=await navigator.serviceWorker?.getRegistration();}catch{}try{const o={body,tag,icon:'icons/icon-192.png',badge:'icons/icon-192.png',lang:'vi'};if(reg&&reg.showNotification){await reg.showNotification(title,o);return true;}new Notification(title,o);return true;}catch{return false;}}
function checkDue(){if(!admin()||!window.Notification||Notification.permission!=='granted')return;const d=mine().filter(t=>!t.actualReturn&&t.returnDate<=today()&&t.departure<=today());if(!d.length)return;const sig=`${user}|${today()}|${d.map(t=>t.id).sort().join(',')}`;let prev='';try{prev=localStorage.getItem(NOTI)||'';}catch{}if(sig===lastDue||sig===prev)return;lastDue=sig;try{localStorage.setItem(NOTI,sig);}catch{}
let body;if(admin()){const n=[...new Set(d.map(t=>t.name))];body=`${n.length} quân nhân đến ngày về theo KH: ${n.slice(0,3).join(', ')}${n.length>3?'…':''}. Hãy xác nhận khi đã về đơn vị.`;}else body=d.length===1?`Đợt công tác ${d[0].destination} đã đến ngày về theo KH (${fmt(d[0].returnDate)}). Hãy xác nhận khi đã về đơn vị.`:`Bạn có ${d.length} đợt công tác đã đến ngày về theo KH. Hãy xác nhận khi đã về đơn vị.`;
notify('Đến ngày về theo KH',body,'due-'+today());}
function notifyCard(){if(!admin()||!window.Notification)return '';if(Notification.permission!=='default'||notiAsked)return '';return `<section class="card"><div class="row"><div><b>Nhận thông báo khi đến ngày về</b><br><small class="muted">Trình duyệt sẽ nhắc khi có đợt công tác đến ngày về theo KH.</small></div><button type="button" data-notify="on">Bật thông báo</button></div></section>`;}
document.addEventListener('click',async e=>{if(!e.target.closest('[data-notify]'))return;notiAsked=true;try{localStorage.setItem(NOTI+'_asked','1');}catch{}let r='';try{r=await Notification.requestPermission();}catch{}if(r==='granted')await notify('Đã bật thông báo','Bạn sẽ được nhắc khi đến ngày về theo KH.','welcome');if(r==='denied')message='Thông báo đang bị chặn. Muốn nhận nhắc ngày về, hãy cho phép thông báo của trang này trong cài đặt trình duyệt.';render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDue();});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dpOpen){e.preventDefault();e.stopPropagation();dpClose(true);}},true);
addEventListener('resize',()=>dpClose());
addEventListener('scroll',e=>{if(dpOpen&&!(e.target.closest&&e.target.closest('.dp-pop')))dpClose();},true);

function labelCells(){document.querySelectorAll('.table table').forEach(t=>{const h=[...t.tHead.rows[0].cells].map(c=>c.textContent);t.querySelectorAll('tbody tr').forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.label=h[i]));});}
const late=()=>mine().filter(t=>!t.actualReturn&&t.departure<=today()&&t.returnDate<today()).sort((a,b)=>a.returnDate.localeCompare(b.returnDate));

function lateCard(){const l=late();return `<section class="card presence out"><div class="presence-head"><h2>Các đồng chí quá ngày công tác</h2><span class="count">${l.length}</span></div><div class="members">${l.map(t=>{const p=data.people.find(x=>x.id===t.personId)||{name:t.name};const n=days(t.returnDate,today())-1;return `<div class="member"><span class="avatar">${esc(initials(p.name||''))}</span><div class="who"><b>${esc(tripLine(t))}</b></div><div class="where late"><b>${esc(t.destination)}</b><small>Ngày về theo KH ${fmt(t.returnDate)} · quá ${n} ngày</small></div>${admin()?`<button data-action="return" data-id="${esc(t.id)}">Xác nhận đã về</button>`:''}</div>`;}).join('')||'<p class="empty-note">Không có đồng chí nào quá ngày về.</p>'}</div></section>`;}
function overview(){const rows=mine().filter(t=>!t.actualReturn);return `<div class="row"><div><h1>Tổng quan công tác</h1></div>${admin()?'<button data-action="new-trip">+ Thêm đợt công tác</button>':''}</div><div class="grid presence-grid">${presence('Đang đi công tác',people().filter(p=>away(p.id)),'out','Không có quân nhân đang công tác.')}${presence('Đang ở đơn vị',people().filter(p=>!away(p.id)),'in','Không có quân nhân ở đơn vị.')}</div><div class="filters">${statusSelect()}</div><section class="card">${rows.length||statusFilter!=='all'?table(rows):'<div class="empty">Hiện không có quân nhân nào chuẩn bị đi, đang đi hoặc quá ngày công tác.</div>'}</section>`;}
function tripsPage(){const tm=searchMode==='time'&&validDate(sFrom)&&validDate(sTo)&&sFrom<=sTo;const a0=tm?sFrom:month+'-01',a1=tm?sTo:endMonth(month);const rows=mine().filter(t=>t.departure<=a1&&(t.actualReturn||t.returnDate)>=a0);return `<div class="row"><div><h1>${tm?`Lịch sử công tác từ ${fmt(sFrom)} đến ${fmt(sTo)}`:'Lịch sử công tác'}</h1></div>${admin()?'<button data-action="new-trip">+ Thêm đợt công tác</button>':''}</div><div class="filters"><label>Tháng theo dõi${dp('month','month',month)}</label>${statusSelect()}</div><section class="card">${searchBar()}${table(rows)}</section>`;}
function roster(){return `<div class="row"><div><h1>Thông tin quân nhân</h1><p>${people().length} quân nhân trong danh sách</p></div>${admin()?'<button data-action="new-person">+ Thêm quân nhân</button>':''}</div><div class="card table"><table><thead><tr><th>Họ tên</th><th>Cấp bậc</th><th>Chức vụ</th><th>Mã hồ sơ</th>${admin()?'<th>Thao tác</th>':''}</tr></thead><tbody>${people().map(p=>`<tr><td><button class="link" data-action="history" data-id="${esc(p.id)}">${esc(p.name)}</button></td><td>${esc(p.rank)}</td><td>${esc(p.position)}</td><td>${esc(p.username)}</td>${admin()?`<td><div class="tools"><button class="light" data-action="edit-person" data-id="${esc(p.id)}">Sửa</button><button class="light" data-action="delete-person" data-id="${esc(p.id)}">Xóa khỏi danh sách</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`;}
function backupPage(){return `<h1>Sao lưu dữ liệu chung</h1><section class="card"><p>Tải dữ liệu máy chủ về tệp JSON để tự lưu giữ. Không tải tệp sao lưu lên GitHub.</p><div class="tools"><button data-action="export">Tải tệp sao lưu</button><button class="light" data-action="import">Nhập bản sao lưu cũ</button></div><p class="muted">Nhập tệp sẽ thay toàn bộ danh sách và lịch dùng chung, nhưng Hãy tải tệp sao lưu hiện tại trước khi nhập.</p><input type="file" id="importFile" accept=".json,application/json" hidden></section>`;}

function editTrip(id=''){if(!admin())return;let t=data.trips.find(t=>t.id===id);let available=people();dialog(`<h2>${t?'Sửa':'Thêm'} đợt công tác</h2><form id="tripForm"><label>Thông tin quân nhân<select name="personId" required><option value="">Chọn quân nhân đang ở đơn vị</option>${available.map(p=>{const busy=p.id!==t?.personId?pending(p.id,t?.id):null;if(busy&&busy.departure<=today())return '';return `<option value="${esc(p.id)}" ${p.id===t?.personId?'selected':''}${busy?' disabled':''}>${esc(idLine(p))}${busy?' - Chuẩn bị đi công tác':''}</option>`;}).join('')}</select></label><div class="grid"><div class="full">${input('plan','Theo kế hoạch',t?.plan)}${input('destination','Nơi công tác',t?.destination)}${input('purpose','Nội dung công tác',t?.purpose,'text',false)}</div>${input('departure','Ngày đi',t?.departure||today(),'date')}${input('returnDate','Ngày về theo KH',t?.returnDate||today(),'date')}${t?input('actualReturn','Ngày về thực tế',t.actualReturn,'date',false):''}</div><p class="muted">Quân nhân đang chờ đi hoặc đang đi công tác không thể phân thêm nhiệm vụ. Muốn phân lại, hãy xóa nhiệm vụ đã phân trước.</p><p id="formError" role="alert"></p><div class="row"><button type="button" class="light" data-action="close">Hủy</button><button>Lưu công tác</button></div></form>`);document.getElementById('tripForm').onsubmit=async e=>{e.preventDefault();try{if(!admin())throw Error('Không có quyền.');const b=Object.fromEntries(new FormData(e.target)),p=people().find(p=>p.id===b.personId);if(!p)throw Error('Chọn quân nhân.');if(!b.plan.trim())throw Error('Nhập mục Theo kế hoạch.');if(!b.destination.trim())throw Error('Nhập mục Nơi công tác.');if(!b.actualReturn){const busy=pending(p.id,t?.id);if(busy)throw Error(`Quân nhân ${pendingMsg(busy)}. Không thể phân thêm nhiệm vụ; muốn phân lại, hãy xóa nhiệm vụ đã phân trước.`);}if(!validDate(b.departure)||!validDate(b.returnDate)||b.returnDate<b.departure)throw Error('Ngày về phải bằng hoặc sau ngày đi.');if(b.actualReturn&&(!validDate(b.actualReturn)||b.actualReturn<b.departure||b.actualReturn>today()))throw Error('Ngày về thực tế phải từ ngày đi đến hôm nay.');if(data.trips.some(x=>x.id!==id&&x.personId===p.id&&x.departure<=(b.actualReturn||b.returnDate)&&(x.actualReturn||x.returnDate)>=b.departure))throw Error('Lịch công tác bị trùng.');let next={id:t?.id||crypto.randomUUID(),personId:p.id,name:p.name,unit:t?.unit||'',destination:b.destination.trim().toUpperCase(),plan:b.plan.trim().toUpperCase(),purpose:b.purpose.trim(),departure:b.departure,returnDate:b.returnDate,actualReturn:b.actualReturn||null,confirmedBy:b.actualReturn?user:''};await mutate(d=>{if(t)d.trips[d.trips.findIndex(x=>x.id===id)]=next;else d.trips.push(next);});document.getElementById('modal').close();notice('Đã lưu đợt công tác lên dữ liệu chung.');}catch(err){document.getElementById('formError').textContent=err.message;}};}
function newPerson(){if(!admin())return;dialog(`<h2>Thêm quân nhân</h2><form id="personForm">${input('name','Họ và tên')}${input('rank','Cấp bậc','1//CN')}${input('position','Chức vụ','Lái Xe')}<p>Mã hồ sơ tự tạo từ họ tên.</p><p id="formError" role="alert"></p><div class="row"><button type="button" class="light" data-action="close">Hủy</button><button>Thêm quân nhân</button></div></form>`);document.getElementById('personForm').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target)),base=slug(f.name);if(!base)throw Error('Họ tên không hợp lệ.');const old=data.people.find(p=>!p.active&&p.username===base);const restore=!!old&&confirm('Đã có hồ sơ "'+old.name+'" bị xóa khỏi danh sách trước đây. Khôi phục hồ sơ này (giữ lại lịch sử công tác cũ)?\n\nBấm Hủy để tạo hồ sơ mới.');if(restore){await mutate(d=>{const p=d.people.find(x=>x.id===old.id);p.name=f.name.trim();p.rank=f.rank.trim();p.position=f.position.trim();p.active=true;});document.getElementById('modal').close();notice('Đã khôi phục hồ sơ '+f.name.trim()+'.');return;}let u=base,n=2;while(['admin1','admin2'].includes(u)||data.people.some(p=>p.username===u))u=base+(n++);await mutate(d=>d.people.push({id:crypto.randomUUID(),name:f.name.trim(),rank:f.rank.trim(),position:f.position.trim(),username:u,active:true}));document.getElementById('modal').close();notice('Đã thêm quân nhân '+f.name.trim()+'.');}catch(err){document.getElementById('formError').textContent=err.message;}};}
function editPerson(id){if(!admin())return;const p=data.people.find(x=>x.id===id);if(!p)return;dialog(`<h2>Sửa thông tin quân nhân</h2><form id="personForm">${input('name','Họ và tên',p.name)}${input('rank','Cấp bậc',p.rank)}${input('position','Chức vụ',p.position)}<p id="formError" role="alert"></p><div class="row"><button type="button" class="light" data-action="close">Hủy</button><button>Lưu thay đổi</button></div></form>`);document.getElementById('personForm').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target)),name=f.name.trim(),rank=f.rank.trim(),position=f.position.trim();if(!name||!rank||!position)throw Error('Hãy nhập đủ họ tên, cấp bậc, chức vụ.');await mutate(d=>{const x=d.people.find(q=>q.id===id);x.name=name;x.rank=rank;x.position=position;d.trips.forEach(t=>{if(t.personId===id)t.name=name;});});document.getElementById('modal').close();notice('Đã cập nhật thông tin '+name+'.');}catch(err){document.getElementById('formError').textContent=err.message;}};}
async function confirmReturn(id){
 const t=mine().find(t=>t.id===id);if(!t||t.actualReturn||t.departure>today()||t.returnDate>today()||busy)return;
 if(!confirm('Xác nhận đã thực sự về đơn vị? Ngày về sẽ do máy chủ ghi nhận.'))return;
 busy=true;
 try{const {error}=await cloud.rpc('sct_confirm',{trip_id:id});if(error)throw error;announceChange();await loadCloud(true);notice('Đã xác nhận về đơn vị trên máy chủ.');}
 catch(e){showError(e);}finally{busy=false;}
}
function linkMember(id){
 dialog(`<h2>Gắn tài khoản đăng nhập</h2><p>Tạo người dùng trong Supabase Authentication trước, sau đó nhập đúng email tại đây. Gắn email mới sẽ thay tài khoản đang gắn với hồ sơ này.</p><form id="linkForm">${input('email','Email tài khoản','','email')}<p id="formError"></p><div class="row"><button type="button" class="light" data-action="close">Hủy</button><button>Gắn tài khoản</button></div></form>`);
 document.getElementById('linkForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{const email=new FormData(e.target).get('email');const {error}=await cloud.rpc('sct_link_member',{member_email:email,member_person_id:id});if(error)throw error;document.getElementById('modal').close();notice('Đã gắn tài khoản. Quân nhân có thể đăng nhập bằng email riêng.');}catch(err){document.getElementById('formError').textContent=cloudError(err);}finally{busy=false;}};
}
async function download(){if(!admin())return;await loadCloud(true);if(!admin())return;let raw=JSON.stringify(data,null,2);const url=URL.createObjectURL(new Blob([raw||''],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='Cong_tac_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importFile(e){if(!admin())return;try{const f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('Tệp quá lớn, tối đa 20 MB.');const next=validate(JSON.parse(await f.text()));if(!confirm(`Thay toàn bộ dữ liệu CHUNG trên máy chủ bằng ${next.people.length} hồ sơ và ${next.trips.length} đợt công tác?\nBạn nên tải bản sao lưu hiện tại trước.`))return;await save(next);notice('Đã nhập bản sao lưu lên máy chủ. Hãy kiểm tra và gắn lại tài khoản nếu cần.');}catch(err){showError(err);}}
const upPlan=e=>{const i=e.target;if(!i||!['plan','destination'].includes(i.name)||e.isComposing)return;const a=i.selectionStart,b=i.selectionEnd,u=i.value.toUpperCase();if(u!==i.value){i.value=u;try{i.setSelectionRange(a,b);}catch{}}};
document.addEventListener('input',upPlan);document.addEventListener('compositionend',upPlan);
document.addEventListener('click',e=>{const t=e.target.closest('[data-pw]');if(!t)return;const i=t.parentElement.querySelector('input'),show=i.type==='password';i.type=show?'text':'password';t.textContent=show?'Ẩn':'Hiện';t.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(busy)return;try{if(b.dataset.view){nav(b.dataset.view);return;}const a=b.dataset.action,id=b.dataset.id;if(a==='logout'){await logout();return;}if(a==='sync'){await loadCloud(true);return;}if(a==='close')document.getElementById('modal').close();if(a==='show-login'){view='login';message='';render();return;}if(a==='cancel-login'){view='overview';render();return;}if(a==='roster'){nav('roster');return;}if(a==='history'){personId=id;view='history';historyMode='all';render();return;}if(a==='return'){if(admin())await confirmReturn(id);return;}if(!admin())return;if(a==='new-trip')editTrip();if(a==='edit')editTrip(id);if(a==='new-person')newPerson();if(a==='edit-person')editPerson(id);if(a==='delete-trip'&&confirm('Xóa đợt công tác này? Hành động không thể hoàn tác nếu chưa sao lưu.')){await mutate(d=>d.trips=d.trips.filter(t=>t.id!==id));notice('Đã xóa đợt công tác.');}if(a==='delete-person'){if(away(id))throw Error('Quân nhân đang công tác. Hãy xác nhận về trước.');if(confirm('Đưa quân nhân ra khỏi danh sách và ngừng tài khoản? Lịch sử công tác vẫn được giữ trong dữ liệu.')){await mutate(d=>d.people.find(p=>p.id===id).active=false);notice('Đã đưa quân nhân ra khỏi danh sách.');}}if(a==='export')await download();if(a==='import')document.getElementById('importFile').click();}catch(err){showError(err);}});
setInterval(()=>{if(!cloud||document.hidden||reading)return;const age=Date.now()-lastFetch;if(admin()){if(age>=60000)loadCloud().catch(showError);}else if(liveOK){if(adminOnline&&age>=60000)loadCloud().catch(()=>{});}else if(age>=120000)loadCloud().catch(()=>{});},15000);
window.addEventListener('online',()=>{if(cloud&&Date.now()-lastFetch>30000)loadCloud().catch(()=>{});});
document.addEventListener('visibilitychange',()=>{if(cloud&&!document.hidden&&Date.now()-lastFetch>60000)loadCloud().catch(()=>{});});
setInterval(()=>{if(account&&view!=='login'&&!dpOpen&&!document.getElementById('modal').open&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))render();},60000);
document.getElementById('modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();});
render();startCloud();
</script></body></html>
